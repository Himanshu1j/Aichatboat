<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Chat</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#2f2f2f;--line:#424242;--text:#ececec;--muted:#a0a0a0;--green:#10a37f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{height:58px;padding:0 22px;border-bottom:1px solid #343434;display:flex;align-items:center;gap:10px;font-weight:600}.logo{width:25px;height:25px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:white;font-size:15px}.model{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
main{width:min(780px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;overflow:hidden}.messages{flex:1;overflow:auto;padding:28px 18px 10px}.welcome{text-align:center;margin:auto;max-width:600px;padding:15vh 12px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.msg{display:flex;gap:14px;padding:17px 0;white-space:pre-wrap;overflow-wrap:anywhere}.avatar{flex:none;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#444;font-size:13px}.msg.assistant .avatar{background:var(--green)}.content{padding-top:2px;min-width:0}.composer-wrap{padding:12px 18px 22px}.composer{display:flex;align-items:end;gap:10px;background:var(--panel);border:1px solid #454545;border-radius:24px;padding:10px 12px 10px 18px;box-shadow:0 8px 28px #0003}.composer:focus-within{border-color:#666}textarea{flex:1;resize:none;max-height:180px;min-height:26px;line-height:26px;border:0;outline:0;background:transparent;color:var(--text);font:inherit}button{border:0;cursor:pointer}#send{height:34px;width:34px;border-radius:50%;background:#ececec;color:#222;font-size:18px;font-weight:700}#send:disabled{opacity:.45;cursor:default}.foot{text-align:center;color:#858585;font-size:11px;margin-top:9px}.new{margin-left:auto;background:transparent;color:#bbb;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}.error{color:#ff8888}
@media(max-width:600px){header{padding:0 14px}.messages{padding:18px 14px}.composer-wrap{padding:8px 12px 15px}.welcome h1{font-size:25px}}
</style></head><body>
<header><div class="logo">✳</div><span>Local Chat</span><span class="model">Qwen2.5 · 1.5B · Q4_K_M</span><button class="new" id="clear">New chat</button></header>
<main><section class="messages" id="messages"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>A private chat powered by a model running on your computer.</p></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message Local Chat" autofocus></textarea><button id="send" title="Send">↑</button></form><div class="foot">Local model · Your conversation stays on this device</div></div></main>
<script>
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),form=document.querySelector('#form'),send=document.querySelector('#send');let history=[];
function add(role,text){document.querySelector('#welcome')?.remove();const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'You':'✳';const body=document.createElement('div');body.className='content';body.textContent=text;row.append(av,body);messages.append(row);messages.scrollTop=messages.scrollHeight;return body}
async function submit(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='26px';history.push({role:'user',content:text});add('user',text);const out=add('assistant','');send.disabled=true;try{const res=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'local-model',messages:history,temperature:0.7,max_tokens:768,stream:false})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');const answer=data.choices?.[0]?.message?.content||'(No response)';out.textContent=answer;history.push({role:'assistant',content:answer})}catch(e){out.textContent='Could not reach the local model. Make sure llama.cpp is running, then try again.\n'+e.message;out.classList.add('error');history.pop()}finally{send.disabled=false;input.focus();messages.scrollTop=messages.scrollHeight}}
form.addEventListener('submit',e=>{e.preventDefault();submit()});input.addEventListener('input',()=>{input.style.height='26px';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});document.querySelector('#clear').onclick=()=>{history=[];messages.innerHTML='<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>A private chat powered by a model running on your computer.</p></div>';input.focus()};
</script></body></html>
